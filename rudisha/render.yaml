services:
  - type: web
    name: rudisha
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false          # you paste this in the Render dashboard, never in code
      - key: JWT_SECRET
        generateValue: true  # Render makes a long random secret for you
      - key: NODE_ENV
        value: production
